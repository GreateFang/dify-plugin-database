identity:
  name: table_schema
  author: shuzhiyinhang
  label:
    en_US: Get Table Schema
    zh_Hans: 获取表结构

description:
  human:
    en_US: Retrieve columns, types, indexes and metadata of one or more tables in VexDB.
    zh_Hans: 获取 VexDB 表的字段类型、索引、元信息等。
  llm: Retrieve columns, types, indexes and metadata of one or more tables in VexDB.

parameters:
  - name: tables
    type: string
    required: false
    label:
      en_US: Tables
      zh_Hans: 表
    human_description:
      en_US: Specify which tables schema you want to get. If not specified, all tables will be used. Multi tables use comma to separate.
      zh_Hans: 指定想要哪些表的结构，如不指定，则使用所有表。多张表用半角逗号隔开。
    llm_description: Specify which tables schema you want to get. If not specified, all tables will be used. Multi tables use comma to separate.
    form: llm

  - name: db_uri
    type: secret-input
    required: false
    label:
      en_US: DB URI
    human_description:
      en_US: Optional, filling in this field will overwrite the database connection entered during authorization.
      zh_Hans: 选填，填写后将覆盖授权时填写的数据库连接。
    form: llm

  - name: schema
    type: string
    required: false
    form: form
    label:
      en_US: Schema
      zh_Hans: Schema 名称
    human_description:
      en_US: Schema name. If `schema` is left empty, the database's default schema is used.
      zh_Hans: 数据库 schema 名称。如果为空，则使用数据库默认 schema。

extra:
  python:
    source: tools/table_schema.py