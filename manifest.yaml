version: 0.0.1
type: plugin
author: shuzhiyinhang
name: vexdb

label:
  en_US: VexDB
  zh_Hans: VexDB

description:
  en_US: VexDB vector database integration for Dify, including database/table management, data operations, and vector search.
  zh_Hans: 为 Dify 提供 VexDB 向量数据库集成，包括表管理、数据操作、向量检索。

icon: icon.svg

resource:
  memory: 268435456
  permission:
    network: true

plugins:
  provider:
    path: provider/vexdb.yaml

  tools:
    - tools/list_databases.yaml
    - tools/list_tables.yaml
    - tools/table_schema.yaml
    - tools/insert_row.yaml
    - tools/vector_search.yaml

  models: []
  endpoints: []

created_at: 2025-01-01T00:00:00+08:00

meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
