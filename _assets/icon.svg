  <circle cx="125" cy="100" r="14" class="blue-fill" />

  <line x1="215" y1="70" x2="215" y2="115" stroke="#1C44D8" class="heavy-stroke" />
  <circle cx="215" cy="35" r="14" class="blue-fill" />
