identity:
  author: shuzhiyinhang
  name: vexdb
  label:
    en_US: VexDB
    zh_Hans: VexDB
  description:
    en_US: Vector database integration tools.
    zh_Hans: 向量数据库集成工具。
  icon: icon.svg

tools:
  - tools/list_databases.yaml
  - tools/list_tables.yaml
  - tools/table_schema.yaml
  - tools/insert_row.yaml
  - tools/vector_search.yaml

extra:
  python:
    source: provider/vexdb.py

credentials_for_provider:
  db_uri:
    help:
      en_US: "Example: `postgresql://user:password@host:5432/dbname`"
      zh_Hans: "例如：`postgresql://user:password@host:5432/dbname`"
    label:
      en_US: VexDB URI
      zh_Hans: VexDB 连接 URI
    placeholder:
      en_US: Enter your VexDB connection URI
      zh_Hans: 请输入 VexDB 数据库连接 URI
    required: false
    type: secret-input
