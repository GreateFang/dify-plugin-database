identity:
  author: shuzhiyinhang
  name: vexdb
  label:
    en_US: VexDB
  description:
    en_US: Vector database integration tools.
    zh_Hans: 向量数据库集成工具。
  icon: icon.svg
tools:
  - tools/table_schema.yaml
  - tools/insert_row.yaml
  - tools/list_databases.yaml
  - tools/vector_search.yaml
  - tools/list_tables.yaml
extra:
  python:
    source: provider/vexdb.py
credentials_for_provider:
  db_uri:
    help:
      en_US: For example `mysql+pymysql://<user>:<password>@<host>:<port>/<database>`
      zh_Hans: 例如 `mysql+pymysql://<user>:<password>@<host>:<port>/<database>`
    label:
      en_US: Database URI
      zh_Hans: 数据库 URI
    placeholder:
      en_US: Please enter the database URI
      zh_Hans: 请输入数据库 URI
    required: false
    type: secret-input
